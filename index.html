  /* Colores de marca: se mantienen iguales aunque el teléfono esté en modo oscuro. */
  :root{--crema:#f7f1e6;--sol:#ffd86f;--tinta:#2e2e2e;--paso:60vh;color-scheme:light}
  @supports (height:1svh){:root{--paso:60svh}}
  @media (pointer:coarse){:root{--paso:45vh}}
  @supports (height:1svh){@media (pointer:coarse){:root{--paso:45svh}}}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--crema:#f7f1e6;--sol:#ffd86f;--tinta:#2e2e2e}}
  *{box-sizing:border-box}
  html{background:var(--crema);overscroll-behavior-y:none}
  body{margin:0;background:var(--crema);color:var(--tinta);-webkit-tap-highlight-color:transparent}

  #escena{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
  #lienzo{display:block;width:100%;height:100%}

  /* El scroll real vive en estos bloques vacíos: cada uno es un postre.
     El ajuste al postre más cercano lo hace el script (ver "fijar"), no CSS. */
  #pasos>div{height:var(--paso)}
  #pasos>div:last-child{height:100vh;height:100lvh}

  #lienzo text{fill:var(--tinta);text-rendering:geometricPrecision;font-synthesis:none}
  .n{font:7.4px "Calder-Dark","Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif}
  .d,.p,.c,.t{font-family:"FluxischElse-Regular","Fluxisch Else","Helvetica Neue",Helvetica,Arial,sans-serif}
  .d{font-size:5.9px}
  .p{font-size:5.4px}
  .c{font-size:6.4px}
  .t{font-size:5.2px}
  .postre{cursor:pointer}
  .anillo{fill:none;stroke:var(--tinta);stroke-width:.5;stroke-linecap:round}

  #cuenta,#pista{position:fixed;font:12px/1 "FluxischElse-Regular","Fluxisch Else","Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums;pointer-events:none}
  #cuenta{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom))}
  #pista{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);transition:opacity .6s}
  body.movido #pista{opacity:0}
  #pista i{display:inline-block;font-style:normal;animation:rebote 1.6s ease-in-out infinite}
  @keyframes rebote{50%{transform:translateY(3px)}}

  /* Sello con el 181: aparece solo cuando el dial queda fuera de pantalla (celular vertical). */
  #sello{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));width:56px;height:56px;display:none;pointer-events:none}
  body.sin-dial #sello{display:block}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){#pista i{animation:none}}
</style>

  const rad = a => a * Math.PI / 180;
  const pt = (r, a) => [O.x + r * Math.cos(rad(a)), O.y + r * Math.sin(rad(a))];
  const norm = d => ((d + 180) % 360 + 360) % 360 - 180;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const f2 = v => v.toFixed(2);

  function sector(r1, r2, a1, a2) {
    const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2), [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1);
    return `M${f2(x4)} ${f2(y4)}L${f2(x1)} ${f2(y1)}A${r2} ${r2} 0 0 1 ${f2(x2)} ${f2(y2)}L${f2(x3)} ${f2(y3)}A${r1} ${r1} 0 0 0 ${f2(x4)} ${f2(y4)}Z`;
  }

  function texto(clase, str, ang, r, ancla, j) {
    const [x, y] = pt(r, ang);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', clase);
    t.setAttribute('transform', `translate(${f2(x)} ${f2(y)}) rotate(${ang})`);
    if (ancla) t.setAttribute('text-anchor', ancla);
    if (j !== undefined) t.dataset.j = j;
    t.textContent = str;
    return t;
  }

  /* Franja fija a las 3 en punto: es donde se lee el postre activo */
  $('ventana').setAttribute('d', sector(R_CENTRO, R_SOL, -PASO_ANG / 2, PASO_ANG / 2));

  /* ---------- Construcción de los postres ---------- */
  // Ángulo del centro del bloque de texto de cada postre (el que se alinea a 0°)
  const FOCO = POSTRES.map((p, k) => -72 + PASO_ANG * k + (p.etiqueta ? 2.5 : 0));
  const grupos = [];

  POSTRES.forEach((p, k) => {
    const c = -72 + PASO_ANG * k;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'postre');
    g.dataset.i = k;

    // zona de toque: todo el gajo del postre
    const zona = document.createElementNS(NS, 'path');
    zona.setAttribute('d', sector(R_CENTRO + 8, R_SOL, FOCO[k] - PASO_ANG / 2, FOCO[k] + PASO_ANG / 2));
    zona.setAttribute('fill', 'transparent');
    g.append(zona);

    g.append(texto('n', p.nombre, c - 5, R0));
    g.append(texto('c', p.precio, c - 5, DERECHA, 'end'));
    p.lineas.forEach((l, j) => g.append(texto('d', l, c + 5 * j, R0, null, j)));
    p.pres.forEach((l, j) => g.append(texto('p', l, c + 5 * j, DERECHA, 'end', j)));
    if (p.etiqueta) g.append(texto('t', p.etiqueta, c + 10, R0));

    const [px, py] = pt(PIVOTE, FOCO[k]);
    postres.append(g);
    grupos.push({ g, px: f2(px), py: f2(py) });

    const div = document.createElement('div');
    pasos.append(div);

    const li = document.createElement('li');
    li.textContent = `${p.nombre}. ${p.lineas.join(' ')} ${p.pres.join(' / ')}.${p.etiqueta ? ' ' + p.etiqueta + '.' : ''}`;
    $('lista').append(li);
  });

  /* Si una descripción choca con su etiqueta (Torta / Cuchareable), se comprime apenas.
     Con las tipografías reales casi nunca hace falta. */
  function ajustar() {
    grupos.forEach(({ g }) => {
      g.querySelectorAll('.d').forEach(d => {
        d.removeAttribute('textLength');
        d.removeAttribute('lengthAdjust');
        const p = g.querySelector(`.p[data-j="${d.dataset.j}"]`);
        const max = DERECHA - R0 - (p ? p.getComputedTextLength() + 5 : 0);
        const len = d.getComputedTextLength();
        if (len > max) {
          d.setAttribute('textLength', max.toFixed(1));
          d.setAttribute('lengthAdjust', 'spacingAndGlyphs');
        }
      });
    });
  }

  /* ---------- Tamaño y posición de la rueda ---------- */
  let W = 0, H = 0, paso = 1;
  function medir() {
    W = innerWidth; H = innerHeight;
    const m = Math.max(14, Math.min(W, H) * 0.035);
    const anchoTexto = 283.46 - 75.4;                // tramo que ocupa el postre activo, de borde de círculo a borde de círculo
    let s = Math.min((W - 2 * m) / anchoTexto, Math.max(H * 0.0029, 1.7));
    // En celular vertical el centro del dial quedaría fuera de pantalla: se achica un poco la rueda
    // para que asome al menos ASOMA px del círculo crema con sus anillos en el borde izquierdo.
    const ASOMA = 46;
    if ((W - m - 283.46 * s) + 68 * s < ASOMA) s = (W - m - ASOMA) / (283.46 - 68);
    const xc = Math.min(W / 2, W - m - 283.46 * s);  // el borde del círculo nunca pasa del margen derecho
    const yc = H / 2;
    marco.setAttribute('transform', `translate(${f2(xc)} ${f2(yc)}) scale(${s.toFixed(4)}) translate(${-O.x} ${-O.y})`);
    document.body.classList.toggle('sin-dial', xc + 68 * s < 90);
    paso = pasos.children[1] ? pasos.children[1].offsetTop - pasos.children[0].offsetTop : 1;
  }

  /* ---------- Movimiento ---------- */
  const rotDe = f => {
    const i = Math.min(N - 2, Math.floor(f));
    const a = FOCO[i] + (FOCO[i + 1] - FOCO[i]) * (f - i);
    return -a;
  };

  let objetivo = 0, cur = 0, intro = reduce ? 0 : -45, t0 = null, pendiente = false;

  function pintar() {
    const rot = rotDe(cur) + intro;
    const tr = `rotate(${rot.toFixed(3)} ${O.x} ${O.y})`;
    dial.setAttribute('transform', tr);
    dial2.setAttribute('transform', tr);
    postres.setAttribute('transform', tr);

    for (let k = 0; k < N; k++) {
      const t = Math.abs(norm(FOCO[k] + rot)) / PASO_ANG;       // 0 = alineado, 1 = vecino
      const w = t < 1 ? 0.5 * (1 + Math.cos(Math.PI * t)) : 0;
      const op = t < 1 ? 0.38 + 0.62 * w : Math.max(0, 0.38 - 0.3 * (t - 1));
      const { g, px, py } = grupos[k];
      g.style.opacity = op.toFixed(3);
      g.style.pointerEvents = op < 0.05 ? 'none' : '';
      g.setAttribute('transform', `translate(${px} ${py}) scale(${(1 + CRECE * w).toFixed(4)}) translate(${-px} ${-py})`);
    }
    const n = String(Math.round(cur) + 1).padStart(2, '0');
    cuenta.textContent = `${n} / ${String(N).padStart(2, '0')}`;
  }

  function pedir() {
    if (!pendiente) { pendiente = true; requestAnimationFrame(tick); }
  }

  function tick(ts) {
    pendiente = false;
    if (t0 === null) t0 = ts;
    if (intro !== 0) {
      const u = Math.min(1, (ts - t0) / 1300);
      intro = u < 1 ? -45 * Math.pow(1 - u, 3) : 0;
      if (u < 1) pedir();
    }
    const d = objetivo - cur;
    if (Math.abs(d) > 0.0004) { cur += reduce ? d : d * 0.22; pedir(); } else cur = objetivo;
    pintar();
  }

  const leer = () => clamp(scrollY / paso, 0, N - 1);
  const yDe = i => i * paso;   // los bloques están vacíos: la posición exacta no depende del relleno de la página

  /* ---------- Ajuste al postre más cercano ----------
     Cuando el scroll se detiene (y el dedo ya se levantó), la rueda termina de alinear un postre.
     Con un deslizamiento corto (>15 % del recorrido de un postre) avanza al siguiente en esa
     dirección, así un gesto chico alcanza para pasar de postre. */
  let asentado = 0, tocando = false, reposo = null;

  const fijar = () => {
    if (tocando) return;
    const f = leer();
    const destino = clamp(Math.round(f + 0.35 * Math.sign(f - asentado)), 0, N - 1);
    asentado = destino;
    const y = yDe(destino);
    if (Math.abs(scrollY - y) > 1) scrollTo({ top: y, behavior: reduce ? 'auto' : 'smooth' });
  };
  const armar = () => { clearTimeout(reposo); reposo = setTimeout(fijar, 140); };

  addEventListener('scroll', () => {
    objetivo = leer();
    document.body.classList.add('movido');
    pedir();
    armar();
  }, { passive: true });

  addEventListener('touchstart', () => { tocando = true; clearTimeout(reposo); }, { passive: true });
  const soltar = () => { tocando = false; armar(); };
  addEventListener('touchend', soltar, { passive: true });
  addEventListener('touchcancel', soltar, { passive: true });

  addEventListener('resize', () => {
    medir();
    objetivo = cur = leer();
    asentado = Math.round(objetivo);
    pintar();
  });

  /* ---------- Ir a un postre (toque, teclado) ---------- */
  const ir = i => {
    asentado = clamp(i, 0, N - 1);
    scrollTo({ top: yDe(asentado), behavior: reduce ? 'auto' : 'smooth' });
  };

  postres.addEventListener('click', e => {
    const g = e.target.closest('.postre');
    if (g) ir(+g.dataset.i);
  });

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); ir(asentado + 1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); ir(asentado - 1); }
    else if (e.key === 'Home') { e.preventDefault(); ir(0); }
    else if (e.key === 'End') { e.preventDefault(); ir(N - 1); }
  });

  /* ---------- Arranque ---------- */
  medir();
  objetivo = cur = leer();
  asentado = Math.round(objetivo);
  pintar();
  ajustar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
  pedir();
})();
</script>
</body>
</html>
